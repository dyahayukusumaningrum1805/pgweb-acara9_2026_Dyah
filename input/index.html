<!DOCTYPE html>
<html>
<head>
    
</head>

<body>
    <h2>Form Penambahan Titik</h2>
    <form action="input.php" onsubmit="return validateForm()" method="post">
        <label for="kecamatan">Kecamatan:</label><br>
        <input type="text" id="kec" name="kecamatan" value=""><br>
        <label for="nama bank">Nama bank:</label><br>
        <input type="text" id="nama_bank" name="nama bank" value=""><br>
        <label for="alamat">Alamat:</label><br>
        <input type="text" id="alamat" name="alamat" value=""><br><br>
        <label for="jumlah">Jumlah:</label><br>
        <input type="text" id="jml" name="jumlah" value=""><br><br>
        <label for="latitude">Latitude:</label><br>
        <input type="text" id="lat" name="latitude" value=""><br><br>
        <label for="longitude">Longitude:</label><br>
        <input type="text" id="long" name="longitude" value=""><br><br>
        <input type="submit" value="Submit">
    </form>
    <p id="informasi"></p>
    <script>
        function validateForm() {

            let luas = document.getElementById("luas").value;
            let text = "";
            if (isNaN(luas) || luas < 1) {
                text = "Data luas harus angka dan tidak boleh bernilai negatif";
                // stop the form submission
                event.preventDefault();
            }
            document.getElementById("informasi").innerHTML = text;
        }
    </script>
</body>

</html>
